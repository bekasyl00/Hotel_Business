services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tynys
      POSTGRES_USER: tynys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - tynys_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tynys -d tynys']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://tynys:${POSTGRES_PASSWORD:-local-development-only}@db:5432/tynys
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - tynys_media:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
volumes:
  tynys_pg:
  tynys_media:
