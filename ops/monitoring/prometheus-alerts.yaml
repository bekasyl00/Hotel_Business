groups:
- name: tynys-operations
  interval: 60s
  rules:
  - alert: TynysMetricsScrapeUnavailable
    expr: up{scrape_job="tynys-api"} == 0 or absent(up{scrape_job="tynys-api"})
    for: 3m
    labels:
      severity: page
      service: tynys-api
      owner: platform-admin
    annotations:
      summary: Tynys metrics cannot be collected
      description: Check HTTPS reachability, the metrics token, deployment and scrape configuration. Missing telemetry is not a healthy zero.
      runbook_url: https://github.com/bekasyl00/Hotel_Business/blob/main/docs/runbooks/operations.md#metrics-scrape
  - alert: TynysMetricsSnapshotStale
    expr: (time() - tynys_metrics_snapshot_timestamp_seconds{scrape_job="tynys-api"} > 180 or absent(tynys_metrics_snapshot_timestamp_seconds{scrape_job="tynys-api"})) and on(scrape_job) (up{scrape_job="tynys-api"} == 1)
    for: 3m
    labels:
      severity: page
      service: tynys-api
      owner: platform-admin
    annotations:
      summary: Tynys database snapshot is stale or missing
      description: Check metrics HTTP status and database connectivity before interpreting queue zeros. A working scrape without the application metric is not sufficient.
      runbook_url: https://github.com/bekasyl00/Hotel_Business/blob/main/docs/runbooks/operations.md#metrics-snapshot
  - alert: TynysSchedulerSuccessStale
    expr: time() - tynys_worker_last_success_timestamp_seconds{scrape_job="tynys-api",worker="payment_scheduler"} > 300
    for: 2m
    labels:
      severity: page
      service: tynys-api
      owner: platform-admin
    annotations:
      summary: No successful scheduled tick for more than five minutes
      description: Inspect scheduler delivery and worker errors. Zero last-success timestamp means no successful run, not recent success. A manual CLI invocation does not clear this alert.
      runbook_url: https://github.com/bekasyl00/Hotel_Business/blob/main/docs/runbooks/operations.md#scheduler
  - alert: TynysPaymentQueueDelayed
    expr: max by (provider, environment, kind) (tynys_payment_job_oldest_due_seconds{scrape_job="tynys-api"}) > 300
    for: 2m
    labels:
      severity: ticket
      service: tynys-api
      owner: platform-admin
    annotations:
      summary: A due payment job is waiting more than five minutes
      description: Check worker progress, leases, provider timeouts and queue size. Future retry backoff is excluded. Do not blindly replay create/refund POSTs.
      runbook_url: https://github.com/bekasyl00/Hotel_Business/blob/main/docs/runbooks/operations.md#payment-queue
  - alert: TynysPaymentJobDead
    expr: sum by (provider, environment, kind) (tynys_payment_jobs{scrape_job="tynys-api",state="dead"}) > 0
    for: 1m
    labels:
      severity: page
      service: tynys-api
      owner: platform-admin
    annotations:
      summary: Payment work requires operator intervention
      description: Inspect the durable job and independently reconcile with the provider. Keep production and sandbox separate; never mark a payment paid or refunded only to clear this alert.
      runbook_url: https://github.com/bekasyl00/Hotel_Business/blob/main/docs/runbooks/operations.md#dead-job
  - alert: TynysProductionReconciliationRequired
    expr: sum(tynys_payments_active{scrape_job="tynys-api",environment="production",status="reconciliation_required"}) + sum(tynys_refunds_active{scrape_job="tynys-api",environment="production",status="reconciliation_required"}) > 0
    for: 2m
    labels:
      severity: page
      service: tynys-api
      environment: production
      owner: platform-admin
    annotations:
      summary: Production payment or refund needs reconciliation
      description: Compare frozen attempt/provider binding with authenticated bank evidence. This alert must not trigger an automatic new charge or refund.
      runbook_url: https://github.com/bekasyl00/Hotel_Business/blob/main/docs/runbooks/operations.md#reconciliation
